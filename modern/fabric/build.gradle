apply from: rootProject.file('gradle/shared.gradle')

architectury {
    platformSetupLoomIde()
    fabric()
}

repositories {
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases' }
}

dependencies {
    add(project.modImplementation, "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version")
    // Only the "Configure" button in Mod Menu uses it, and the mod runs without Mod Menu.
    add(project.unobfuscated ? 'compileOnly' : 'modCompileOnly', "com.terraformersmc:modmenu:$project.modmenu_version") { transitive = false }
}

processResources {
    def props = [
            mod_id           : rootProject.mod_id,
            mod_name         : rootProject.mod_name,
            version          : project.version,
            minecraft_range  : project.minecraft_range_fabric,
            java_version     : project.java_version,
            fabric_loader_min: rootProject.fabric_loader_min,
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}
