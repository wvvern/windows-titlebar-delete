// Only a Gradle run of runClient alone with -Pquilt puts Quilt Loader in place of Fabric Loader, so no release build changes.
def quilt = project.hasProperty('quilt') && gradle.startParameter.taskNames.every { it.endsWith('runClient') }
if (quilt) {
    ext['loom.platform'] = 'quilt'
}

apply from: rootProject.file('gradle/shared.gradle')

architectury {
    platformSetupLoomIde()
    fabric()
}

def loader = quilt ? "org.quiltmc:quilt-loader:$rootProject.quilt_loader_version" : "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

if (quilt) {
    repositories { maven { url 'https://maven.quiltmc.org/repository/release/' } }
    loom.runs.named('client') { runDir 'run/quilt' }
    // The jar is a file and not the output of a task, because a build with -Pquilt writes the version of Quilt Loader in the manifest.
    def quiltMods = tasks.register('quiltMods', Sync) {
        from { project.releaseJarTask.get().archiveFile.get().asFile }
        into 'run/quilt/mods'
    }
    // Quilt Loader gets the mod only as the release jar in the mods folder, as in an install, so the dev classes go off the classpath.
    configurations.matching { it.name == 'developmentFabric' }.configureEach { extendsFrom = [] }
    tasks.named('runClient') {
        dependsOn quiltMods
        classpath = files(classpath.from.toList()).minus(sourceSets.main.output + configurations.common)
    }
}

dependencies {
    add(project.modImplementation, loader)
}

processResources {
    def props = [
            mod_id           : rootProject.mod_id,
            mod_name         : rootProject.mod_name,
            version          : project.version,
            minecraft_range  : project.minecraft_range_fabric,
            java_version     : project.java_version,
            fabric_loader_min: rootProject.fabric_loader_min,
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}
