// Shared setup for every Minecraft version node of common, fabric, forge and neoforge.
def loader = project.parent.name
def node = stonecutter.current.project

def versionProperties = new Properties()
rootProject.file("versions/${node}/gradle.properties").withInputStream { versionProperties.load(it) }
versionProperties.each { key, value -> project.ext.set(key, value) }

// Minecraft is obfuscated up to 1.21.11 and unobfuscated from 26.1 on.
def unobfuscated = stonecutter.eval(stonecutter.current.version, '>=26.1')
def javaVersion = (project.java_version as String).toInteger()
ext.modImplementation = unobfuscated ? 'implementation' : 'modImplementation'
ext.commonNamed = { String path -> unobfuscated ? project.project(path) : project.dependencies.project(path: path, configuration: 'namedElements') }
// The loaders that have a jar for this Minecraft version.
ext.platforms = ['fabric', 'forge', 'neoforge'].findAll { rootProject.findProject(":${it}:${node}") != null }

group = "${rootProject.maven_group}.${loader}"
version = "${rootProject.mod_version}+${project.minecraft_version}"

apply plugin: unobfuscated ? 'dev.architectury.loom-no-remap' : 'dev.architectury.loom'
apply plugin: 'architectury-plugin'
if (loader != 'common') {
    apply plugin: 'com.gradleup.shadow'
}

architectury {
    minecraft = project.minecraft_version
}

base {
    archivesName = "$rootProject.archives_name-$loader"
}

dependencies {
    minecraft "com.mojang:minecraft:$project.minecraft_version"
    if (!unobfuscated) {
        mappings loom.officialMojangMappings()
    }
}

if (loader == 'common') {
    // The version-agnostic core is compiled straight into common (it has no Minecraft types).
    sourceSets.main.java.srcDir rootProject.file('../core/src/main/java')
    // The core resources (the icon) go into the jar next to the core classes.
    sourceSets.main.resources.srcDir rootProject.file('../core/src/main/resources')
} else if (project.hasProperty('harness')) {
    // -Pharness=<dir> starts the test harness of the core (core/dev/Harness) in a window with a fixed size.
    loom.runs.named('client') {
        property('wtd.harness', new File(project.property('harness') as String).absolutePath)
        programArgs('--width', '1280', '--height', '720')
    }
}

java {
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
    toolchain { languageVersion = JavaLanguageVersion.of(javaVersion) }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    // Java 8 has no --release flag for the same JDK, so the toolchain alone sets the level there.
    if (javaVersion > 8) it.options.release = javaVersion
}

tasks.withType(AbstractArchiveTask).configureEach {
    zip64 = true
}

processResources {
    def props = [java_version: javaVersion]
    inputs.properties props
    filesMatching(['*.mixins.json']) { expand props }
}

if (loader != 'common') {
    configurations {
        common { canBeResolved = true; canBeConsumed = false }
        compileClasspath.extendsFrom common
        runtimeClasspath.extendsFrom common
        shadowBundle { canBeResolved = true; canBeConsumed = false }
    }
    def platformName = loader == 'neoforge' ? 'NeoForge' : loader.capitalize()
    // The Architectury plugin creates this configuration later, when the branch script picks the platform.
    configurations.matching { it.name == "development${platformName}" }.configureEach { extendsFrom configurations.common }

    def commonNode = ":common:${node}"
    dependencies {
        common(commonNamed(commonNode)) { transitive false }
        shadowBundle project(path: commonNode, configuration: "transformProduction${platformName}")
    }

    jar { archiveClassifier = 'raw' }

    tasks.named('shadowJar') {
        configurations = [project.configurations.shadowBundle]
        mergeServiceFiles()
        archiveClassifier = unobfuscated ? '' : 'dev-shadow'
    }
    if (!unobfuscated) {
        tasks.named('remapJar') {
            inputFile.set(tasks.named('shadowJar').flatMap { it.archiveFile })
            dependsOn 'shadowJar'
            archiveClassifier = ''
        }
    }
    ext.releaseJarTask = tasks.named(unobfuscated ? 'shadowJar' : 'remapJar')
    tasks.register('releaseJar') {
        group = 'build'
        description = 'Builds the jar to install for this loader and Minecraft version.'
        dependsOn releaseJarTask
    }
    tasks.named('assemble') { dependsOn 'releaseJar' }
}
