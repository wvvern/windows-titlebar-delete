pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.minecraftforge.net/" }
        maven { url "https://maven.neoforged.net/releases" }
        maven { url "https://maven.kikugie.dev/releases" }
        gradlePluginPortal()
    }
    // Obfuscated versions (<= 1.21.11) use the remapping Loom; unobfuscated ones (26.1+) the no-remap variant.
    plugins {
        id 'dev.architectury.loom' version '1.17-SNAPSHOT'
        id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT'
        id 'architectury-plugin' version '3.5-SNAPSHOT'
        id 'com.gradleup.shadow' version '9.6.1'
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id 'dev.kikugie.stonecutter' version '0.9.8'
}

rootProject.name = 'windowstitlebardelete-modern'

// The Minecraft-free core is a project here only so its own checks run; platform jars compile its sources directly.
if (file('../core/build.gradle').exists()) {
    include 'core'
    project(':core').projectDir = file('../core')
}

stonecutter {
    kotlinController = false
    centralScript = 'build.gradle'

    create(getRootProject()) {
        // Each node needs versions/<version>/gradle.properties and a <loader>/versions/<version>/gradle.properties.
        versions '1.16.5', '1.17.1', '1.18.2', '1.19.2', '1.19.4', '1.20.1', '1.20.4', '1.20.6',
                '1.21.1', '1.21.3', '1.21.4', '1.21.5', '1.21.8', '1.21.10', '1.21.11', '26.1', '26.2', '26.3'
        vcsVersion = '26.3'

        branch 'common'
        branch 'fabric'
        branch('forge') {
            versions '1.16.5', '1.17.1', '1.18.2', '1.19.2', '1.19.4', '1.20.1', '1.20.4'
        }
        branch('neoforge') {
            versions '1.20.4', '1.20.6', '1.21.1', '1.21.3', '1.21.4', '1.21.5', '1.21.8', '1.21.10', '1.21.11',
                    '26.1', '26.2', '26.3'
        }
    }
}
