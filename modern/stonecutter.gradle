plugins {
    id 'dev.kikugie.stonecutter'
    id 'dev.architectury.loom' apply false
    id 'dev.architectury.loom-no-remap' apply false
    id 'architectury-plugin' apply false
    id 'com.gradleup.shadow' apply false
}

// The version whose code is active (uncommented) in src/. "Set active project to X" tasks rewrite this line.
stonecutter.active '26.3'

stonecutter.parameters {
    // In code, `/*$ minecraft*/ "26.3";` becomes the Minecraft version of the node.
    def node = new Properties()
    file("versions/${current.project}/gradle.properties").withInputStream { node.load(it) }
    swaps.put('minecraft', "\"${node.minecraft_version}\";")
}

// One folder with the release jar of every loader and Minecraft version: build/libs/.
tasks.register('collectJars', Copy) {
    group = 'build'
    description = 'Builds every loader x Minecraft version release jar and copies them to build/libs.'
    subprojects.findAll { it.parent?.name in ['fabric', 'forge', 'neoforge'] }.each { node ->
        dependsOn "${node.path}:releaseJar"
        from(node.layout.buildDirectory.dir('libs')) {
            include '*.jar'
            exclude '*-raw.jar', '*-sources.jar', '*-dev-shadow.jar'
        }
    }
    into layout.buildDirectory.dir('libs')
}
